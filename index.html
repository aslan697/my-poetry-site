<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شعر و گفت‌وگو</title>
    <!-- اتصال به کتابخانه سوپابیس -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        #chat-box { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; background: white; margin-bottom: 10px; text-align: right; }
        .msg { margin-bottom: 10px; padding: 5px; border-bottom: 1px solid #eee; }
        input, textarea, button { padding: 10px; margin: 5px 0; width: 80%; border-radius: 5px; border: 1px solid #ddd; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2>تالار گفت‌وگوی شعر</h2>
    <div id="chat-box">در حال بارگذاری پیام‌ها...</div>
    
    <input type="text" id="name" placeholder="نام خود را وارد کنید">
    <input type="text" id="city" placeholder="شهر">
    <textarea id="message" placeholder="متن پیام شما..."></textarea>
    <br>
    <button onclick="sendMessage()">ارسال پیام</button>

    <script>
        // ۱. آدرس دیتابیس تو
        const SUPABASE_URL = 'https://bvjejxvkkkzlxgoxwfof.supabase.co';

        // ۲. اینجا همون کلیدی که با eyJ شروع میشه رو پیست کن (بین دو تا کوتیشن)
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2amVqeHZra2t6bHhnb3h3Zm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzI2NzUsImV4cCI6MjEwNjAwODY3NX0.bgtcHV8UqtIXZbBRU8exxhE6f-uRaKdEvasDZrRCluk'; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function sendMessage() {
            const name = document.getElementById('name').value;
            const city = document.getElementById('city').value;
            const content = document.getElementById('message').value;

            if(!name || !content) { alert('لطفا نام و متن پیام را وارد کنید'); return; }

            const { error } = await supabase.from('messages').insert([{ user_name: name, user_city: city, content: content }]);
            if (error) alert('خطا در ارسال: ' + error.message);
            else document.getElementById('message').value = '';
        }

        async function fetchMessages() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: false });
            if (data) {
                const box = document.getElementById('chat-box');
                box.innerHTML = data.map(m => `<div class="msg"><b>${m.user_name}</b> (${m.user_city}): ${m.content}</div>`).join('');
            }
        }

        // گوش دادن زنده به دیتابیس
        supabase.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, fetchMessages).subscribe();
        fetchMessages();
    </script>
</body>
</html>
