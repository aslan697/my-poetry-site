<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دیوان اختصاصی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f1f5f9; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #f59e0b; text-align: center; }
        .poem-card { border-bottom: 1px solid #334155; padding: 15px 0; }
        button { cursor: pointer; padding: 10px; border-radius: 8px; border: none; margin: 5px; color: white; }
        .btn-add { background: #6366f1; width: 100%; }
        .btn-backup { background: #10b981; font-size: 12px; }
        .btn-restore { background: #ef4444; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>دیوان لجند</h1>
    <div style="text-align:center; margin-bottom:20px;">
        <span style="color:#6366f1; font-weight:bold;">رتبه: لجند</span>
    </div>

    <div class="card">
        <h3>مدیریت کتابخانه</h3>
        <button class="btn-add" onclick="addPoem()">+ افزودن شعر جدید</button>
        <div style="margin-top:10px; display:flex; justify-content: space-between;">
            <button class="btn-backup" onclick="exportData()">📥 دانلود بک‌آپ (ذخیره)</button>
            <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
            <button class="btn-restore" onclick="document.getElementById('fileInput').click()">📤 بازیابی بک‌آپ</button>
        </div>
    </div>

    <div class="card" id="poems-list">
        <!-- شعرها اینجا میان -->
    </div>
</div>

<script>
    let poems = JSON.parse(localStorage.getItem('my_poems')) || [];

    function render() {
        const list = document.getElementById('poems-list');
        list.innerHTML = poems.length ? poems.map(p => `
            <div class="poem-card">
                <h4 style="margin:0">${p.title}</h4>
                <p style="font-size:14px; color:#94a3b8;">${p.body.replace(/\n/g, '<br>')}</p>
            </div>
        `).join('') : '<p>هنوز شعری اضافه نکردی.</p>';
    }

    function addPoem() {
        const pass = prompt("رمز ادمین:");
        if (pass !== "1234") return alert(" رمز اشتباهه کص ننت!");
        
        const title = prompt("عنوان شعر:");
        const body = prompt("متن شعر:");
        if(title && body) {
            poems.push({ title, body });
            localStorage.setItem('my_poems', JSON.stringify(poems));
            render();
        }
    }

    // بک‌آپ گرفتن (برای اینکه اطلاعاتت نپره)
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(poems));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "poems_backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    // بازگردانی اطلاعات
    function importData(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            poems = JSON.parse(e.target.result);
            localStorage.setItem('my_poems', JSON.stringify(poems));
            render();
        };
        reader.readAsText(file);
    }

    render();
</script>
</body>
</html>
