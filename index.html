<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دیوان و گفت‌وگو</title>
    <!-- لود کتابخانه -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .wrapper { width: 100%; max-width: 500px; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="reg-screen" class="card">
        <h3>ورود به چت</h3>
        <input type="text" id="reg-name" placeholder="نام">
        <input type="text" id="reg-city" placeholder="شهر">
        <button onclick="register()">شروع چت</button>
    </div>

    <div id="chat-screen" class="card hidden">
        <div id="rank-badge" style="color:gold; font-weight:bold; margin-bottom:10px;">رتبه شما: نوپا</div>
        <div id="chat-box" style="height:300px; overflow-y:auto; background:rgba(0,0,0,0.3); padding:10px; margin-bottom:10px; border-radius:5px;"></div>
        <textarea id="message" placeholder="پیام..."></textarea>
        <button onclick="sendMessage()">ارسال</button>
    </div>
</div>

<script>
    // ۱. اینجا کلیدت رو وارد کن
    const db = supabase.createClient('https://bvjejxvkkkzlxgoxwfof.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2amVqeHZra2t6bHhnb3h3Zm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzI2NzUsImV4cCI6MjEwNjAwODY3NX0.bgtcHV8UqtIXZbBRU8exxhE6f-uRaKdEvasDZrRCluk');
    
    function register() {
        const name = document.getElementById('reg-name').value;
        const city = document.getElementById('reg-city').value;
        if(!name || !city) return alert('همه فیلدها را پر کن');
        localStorage.setItem('user_name', name);
        localStorage.setItem('user_city', city);
        localStorage.setItem('points', 0);
        location.reload(); // رفرش برای اعمال تنظیمات
    }

    if(localStorage.getItem('user_name')) {
        document.getElementById('reg-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
        fetchMessages();
    }

    async function sendMessage() {
        const content = document.getElementById('message').value;
        if(!content) return;
        
        let pts = parseInt(localStorage.getItem('points') || 0) + 10;
        localStorage.setItem('points', pts);
        
        const { error } = await db.from('messages').insert([{ 
            user_name: localStorage.getItem('user_name'),
            user_city: localStorage.getItem('user_city'),
            content: content,
            user_rank: pts > 1000 ? 'لجند' : (pts > 100 ? 'استاد' : 'نوپا')
        }]);
        
        document.getElementById('message').value = '';
        if(error) alert(error.message);
    }

    async function fetchMessages() {
        const { data } = await db.from('messages').select('*').order('created_at', { ascending: false });
        if (data) {
            document.getElementById('chat-box').innerHTML = data.map(m => `
                <div style="margin-bottom:10px; font-size:14px;">
                    <b style="color:#6366f1">${m.user_name} (${m.user_city})</b> <small style="color:gold">[${m.user_rank}]</small>: ${m.content}
                </div>
            `).join('');
        }
    }

    // آپدیت زنده (ریل‌تایم)
    db.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, fetchMessages).subscribe();
</script>
</body>
</html>
